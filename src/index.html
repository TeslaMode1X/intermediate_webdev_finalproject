<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interest Rate Calculator - Quickly Calculate Interest on Loans</title>
    <meta name="description" content="Quickly and accurately calculate interest rates on loans with our easy-to-use interest rate calculator. Determine the interest you'll pay and make informed financial decisions. Try our free online calculator now." />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" type="text/css" media="all" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
    <script defer src="script.js"></script>
</head>
<body>
    <main class="container">
        <h1>Interest Rate Calculator</h1>
        <div class="input-wrapper">
            <div class="wrapper">
                <label for="principal">Principal Amount</label>
                <input type="number" id="principal" value="1000" min="0" step="any" />
            </div>
        </div>
        <div class="input-wrapper">
            <div class="wrapper">
                <label for="rate">Rate (%)</label>
                <input type="number" id="rate" value="5" min="0" step="any" />
            </div>
        </div>
        <div class="input-wrapper">
            <div class="wrapper">
                <label for="time">Time (Years)</label>
                <input type="number" id="time" value="1" min="0" step="any" />
            </div>
        </div>
        <button id="calculate-btn" type="button" onclick="calculate()">Calculate</button>
        <div id="result" aria-live="polite"></div>
    </main>
</body>
</html>
